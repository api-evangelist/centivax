aid: centivax
name: Centivax
description: 'Centivax is a clinical-stage biotechnology company based in South San Francisco, California,
  developing broad-spectrum vaccines to prevent infectious diseases at scale. Its lead program is a universal,
  broadly protective influenza vaccine in Phase 1 clinical development designed to protect against all
  strains of the virus. The company''s pandemic-prevention work received a Gates Foundation Grand Challenge
  award and was featured in Netflix''s "Pandemic: How to Prevent an Outbreak." Centivax''s mission is to
  accelerate the world''s transition to a post-pathogen humanity. This is a life-sciences company profile
  in the API Evangelist network; Centivax does not currently publish a public developer or API platform.'
